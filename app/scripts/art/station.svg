  <circle cx="480" cy="148" r="6"/><circle cx="542" cy="196" r="5"/><circle cx="562" cy="284" r="6"/><circle cx="534" cy="344" r="5"/>
  <circle cx="570" cy="412" r="6"/>
  <circle cx="632" cy="152" r="5"/><circle cx="640" cy="252" r="6"/><circle cx="760" cy="336" r="5"/>
  <circle cx="902" cy="232" r="6"/><circle cx="952" cy="182" r="5"/><circle cx="920" cy="150" r="4"/>
